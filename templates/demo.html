<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }} — WebIDE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  /* Same as the editor: settle the theme before anything paints, so a lesson
     projected in light mode never opens with a flash of dark. */
  (function () {
    try {
      var saved = localStorage.getItem("webide-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
      var size = parseInt(localStorage.getItem("webide-code-size"), 10);
      if (size >= 11 && size <= 32) {
        document.documentElement.style.setProperty("--code-size", size + "px");
      }
    } catch (e) { /* storage blocked; the CSS default still applies */ }
  })();
</script>
</head>

<body class="is-demo">

<header class="bar">
  <div class="brand"><span class="logo">🎨</span> WebIDE</div>

  <div class="actions">
    <button id="run" class="btn btn-run">
      <span class="btn-icon">▶</span><span id="run-label">Run</span>
    </button>
    <button id="stop" class="btn btn-stop" hidden>■ Stop</button>
    <div class="stepper" role="group" aria-label="Console text size">
      <button id="font-down" class="step" title="Smaller text">−</button>
      <span id="font-size" class="step-value" aria-live="polite">14</span>
      <button id="font-up" class="step" title="Bigger text">+</button>
    </div>
    <button id="theme" class="btn btn-icon-only" title="Switch between light and dark">
      <span id="theme-glyph">☾</span>
    </button>
  </div>
</header>

<main class="demo-main">
  <section class="pane pane-right">
    <div id="preview-view" class="subpane">
      <div class="pane-head">
        <span>Preview</span>
        <span class="hint">Press Run to see it</span>
      </div>
      <!-- Only appears once a link has moved the preview off the home page. -->
      <div id="preview-trail" class="trail" hidden>
        <button id="preview-back" class="linkbtn">◀ Back</button>
        <span class="trail-page">showing <code id="preview-page">index.html</code></span>
      </div>
      <div class="preview-frame">
        <!-- allow-scripts WITHOUT allow-same-origin: the page runs normally
             but on a null origin. allow-forms only lets the submit event
             fire — the bridge catches every submission. -->
        <iframe id="preview" title="Page preview"
                sandbox="allow-scripts allow-forms"></iframe>
      </div>
      <div class="pane-head console-head">
        <span>Console</span>
        <button id="clear" class="linkbtn">Clear</button>
      </div>
      <pre id="output" class="output"><span class="dim">Press Run to see the page.</span>
</pre>
    </div>
  </section>
</main>

<script>
  /* Only the slug. The project itself is fetched when Run is pressed, and is
     never written into this document — nothing here is worth reading. */
  window.WEBIDE_DEMO = { sourceUrl: "{{ url_for('demo_source', slug=slug) }}" };
</script>
<script src="{{ url_for('static', filename='runner.js') }}"></script>
<script src="{{ url_for('static', filename='demo.js') }}"></script>
</body>
</html>
