<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="avatar">🦊</div>
    <h2 class="name">Your Name</h2>
    <p class="role">Web Design Student</p>
    <button class="follow" id="follow">Follow</button>
    <p class="count"><span id="followers">0</span> followers</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
